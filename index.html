<!DOCTYPE html>

    <style>

            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f8f9fa;
        }
        .container {
            background: white;

            color: inherit;

            justify-content: center;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(44, 90, 160, 0.12);
            border-color: #2c5aa0;
        }
        .card h3 {
            color: #2c5aa0;
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        .card p {
            margin: 0;
            font-size: 14px;
            color: #718096;
        }
        .footer {
            margin-top: 30px;
